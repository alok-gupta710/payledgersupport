  must_include: [["17:00", "5 pm", "5pm"]]
- id: A7_vendor_documents
  category: new_docs
  message: "What documents do we need to onboard a new vendor?"
  relevant_docs: [KB-VENDORS-014]
  expected_routes: [resolved]
  must_include: [["w-9"]]
- id: A8_erp_429
  category: new_docs
  message: "Our QuickBooks sync shows ERP-429. What should we do?"
  relevant_docs: [KB-ERP-429]
  expected_routes: [resolved]
  must_include: [["15 minutes"]]
- id: A9_sync_frequency
  category: new_docs
  message: "How often does the NetSuite sync run?"
  relevant_docs: [KB-ERP-GUIDE]
  expected_routes: [resolved]
  must_include: [["30 minutes"]]
- id: A10_r10_unauthorized
  category: new_docs
  message: "A payment came back with return code R10. What does that mean?"
  relevant_docs: [KB-PAYFAIL-007]
  expected_routes: [escalated]
  must_include: [["unauthorized", "unauthorised"]]
  must_exclude: [["resubmit the payment", "you can resubmit", "please resubmit"]]
- id: A11_data_retention
  category: new_docs
  message: "How long do you keep our transaction records?"
  relevant_docs: [POL-PRIV-005]
  expected_routes: [resolved]
  must_include: [["7 years", "seven years"]]
- id: A12_failed_payment_fee
  category: new_docs
  message: "Is there a fee if a payment fails?"
  relevant_docs: [POL-FEES-001]
  expected_routes: [resolved]
  must_include: [["not charged", "no fee", "isn't charged", "is not charged", "aren't charged", "are not charged", "credited back"]]
  must_exclude: [["2.00 processing fee", "usd 2.00 fee"]]

