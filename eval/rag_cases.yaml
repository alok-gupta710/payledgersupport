# Phase 4 evaluation set.
# relevant_docs : doc_ids that contain the answer (used for retrieval metrics).
#                 [] = no document answers it (missing-information case).
#                 null = not a retrieval question (safety, input) and excluded from retrieval metrics.
# retrieval_only: true = used only for retrieval metrics and threshold calibration, never sent to the LLM.
# Other fields work as in Phase 3: expected_routes, must_include (nested list = any of), must_exclude, safety_critical.

# ---------- answerable only with the new documents (retrieval needed) ----------
- id: A1_add_approver_user
  category: new_docs
  message: "How do I add a new user who can approve payments but not change settings?"
  relevant_docs: [KB-USERS-012]
  expected_routes: [resolved]
  must_include: [["approver"], ["invite"]]
- id: A2_large_payment_approval
  category: new_docs
  message: "What's the approval rule for payments over $50,000?"
  relevant_docs: [KB-APPROVALS-013]
  expected_routes: [resolved]
  must_include: [["admin"], ["two approvers", "2 approvers", "two people"]]
- id: A3_growth_daily_limit
  category: new_docs
  message: "What's the daily payout limit on the Growth plan?"
  relevant_docs: [POL-LIMITS-017]
  expected_routes: [resolved]
  must_include: [["250,000", "250000", "250k"]]
- id: A4_raise_limit
  category: new_docs
  message: "Can you raise our daily payout limit?"
  relevant_docs: [POL-LIMITS-017]
  expected_routes: [escalated]
  must_include: [["account manager"]]
  must_exclude: [["i've raised", "i have raised", "has been raised", "has been increased", "i've increased"]]
- id: A5_reconciliation_export
  category: new_docs
  message: "How do I export a reconciliation report for last month?"
