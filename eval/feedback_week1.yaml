  intent: payment_cancel
  message: "Can I cancel a payment that's already processing?"
  approved_answer: "Not once it's processing. A scheduled invoice payment can be cancelled in Invoices > Scheduled until 17:00 ET on the business day before its scheduled date; after that it's processing and can't be cancelled."
  approved_citations: [KB-INVOICES-015]
  approved_route: resolved
  approved_by: team-lead-01
