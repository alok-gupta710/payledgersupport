# Few-shot examples for v5_rag_grounded, in the same user-turn format the agent builds.
# Topics deliberately differ from eval/rag_cases.yaml to limit test leakage.
- name: answer_from_excerpt
  user_turn: |
    CUSTOMER MESSAGE:
    How much is a standard ACH payout?

    ACCOUNT LOOKUPS:
    none (no payment, payout, invoice or error IDs in the message)

    POLICY EXCERPTS (retrieved; approved, active versions only):
    [E1] POL-FEES-001 v2.1 | Fee Schedule > Payout fees | relevance 0.71
    Domestic ACH payouts cost USD 0.50 per payout. Same-day ACH payouts cost USD 2.00 per payout.
  decision:
    decision_notes: "One intent, answered directly by E1."
    intents: [ach_payout_fee]
    route: resolved
    answer: "A standard (domestic) ACH payout costs USD 0.50."
    citations: [POL-FEES-001]
    escalation: null
    unanswered: []

